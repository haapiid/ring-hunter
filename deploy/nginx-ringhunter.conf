# nginx site for www.ringhunter.fun (HTTPS is added by: certbot --nginx -d www.ringhunter.fun -d ringhunter.fun --redirect)
# The bare domain redirects to www, because the account server only accepts its public origin (RH_PUBLIC_ORIGIN).
server {
    listen 80;
    server_name ringhunter.fun;
    location / {
        return 301 https://www.ringhunter.fun$request_uri;
    }
}

server {
    listen 80;
    server_name www.ringhunter.fun;
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
